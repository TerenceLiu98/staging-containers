name: Build Meta Bundle Image

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to Docker Hub.
        required: true
        default: true
        type: boolean
      registry_prefix:
        description: Registry namespace.
        required: false
        default: "docker.io/terencelau"
        type: string
      target_platforms:
        description: Comma-separated target platforms.
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      mihomo_version:
        description: Override MIHOMO_VERSION.
        required: false
        default: ""
        type: string
      zashboard_version:
        description: Override ZASHBOARD_VERSION.
        required: false
        default: ""
        type: string
      zashboard_sha256:
        description: SHA256 for the overridden zashboard dist.zip.
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - .github/workflows/meta-bundle.yml
      - meta-bundle/**
      - versions/meta-bundle.env
      - README.md
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/meta-bundle.yml
      - meta-bundle/**
      - versions/meta-bundle.env
      - README.md

permissions:
  contents: read

concurrency:
  group: meta-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions and build settings
        id: resolve
        env:
          INPUT_PUSH_IMAGES: ${{ inputs.push_images }}
          INPUT_REGISTRY_PREFIX: ${{ inputs.registry_prefix }}
          INPUT_TARGET_PLATFORMS: ${{ inputs.target_platforms }}
          INPUT_MIHOMO_VERSION: ${{ inputs.mihomo_version }}
          INPUT_ZASHBOARD_VERSION: ${{ inputs.zashboard_version }}
          INPUT_ZASHBOARD_SHA256: ${{ inputs.zashboard_sha256 }}
        run: |
          set -euo pipefail

          set -a
          . versions/meta-bundle.env
          set +a

          if [ -n "${INPUT_MIHOMO_VERSION:-}" ]; then
            MIHOMO_VERSION="${INPUT_MIHOMO_VERSION}"
          fi
          if [ -n "${INPUT_ZASHBOARD_VERSION:-}" ]; then
            ZASHBOARD_VERSION="${INPUT_ZASHBOARD_VERSION}"
          fi
          if [ -n "${INPUT_ZASHBOARD_SHA256:-}" ]; then
            ZASHBOARD_SHA256="${INPUT_ZASHBOARD_SHA256}"
          fi

          REGISTRY_PREFIX="${INPUT_REGISTRY_PREFIX:-docker.io/terencelau}"
          PLATFORMS="${INPUT_TARGET_PLATFORMS:-linux/amd64,linux/arm64}"
          PUSH_IMAGES=false

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            PLATFORMS=linux/amd64
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${INPUT_PUSH_IMAGES:-false}" = "true" ]; then
            PUSH_IMAGES=true
          fi

          IMAGE_NAME="${REGISTRY_PREFIX}/meta-bundle"
          VERSION_TAG="core-${MIHOMO_VERSION#v}-ui-${ZASHBOARD_VERSION#v}"
          REGISTRY_HOST="${REGISTRY_PREFIX%%/*}"
          if [[ "${REGISTRY_HOST}" != *.* && "${REGISTRY_HOST}" != *:* && "${REGISTRY_HOST}" != "localhost" ]]; then
            REGISTRY_HOST=docker.io
          fi

          {
            echo "mihomo_version=${MIHOMO_VERSION}"
            echo "zashboard_version=${ZASHBOARD_VERSION}"
            echo "zashboard_sha256=${ZASHBOARD_SHA256}"
            echo "platforms=${PLATFORMS}"
            echo "push_images=${PUSH_IMAGES}"
            echo "registry_host=${REGISTRY_HOST}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION_TAG}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        if: steps.resolve.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.resolve.outputs.registry_host }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: meta-bundle
          file: meta-bundle/Dockerfile
          platforms: ${{ steps.resolve.outputs.platforms }}
          push: ${{ steps.resolve.outputs.push_images }}
          pull: true
          tags: ${{ steps.resolve.outputs.tags }}
          build-args: |
            MIHOMO_VERSION=${{ steps.resolve.outputs.mihomo_version }}
            ZASHBOARD_VERSION=${{ steps.resolve.outputs.zashboard_version }}
            ZASHBOARD_SHA256=${{ steps.resolve.outputs.zashboard_sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
