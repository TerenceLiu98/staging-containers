apiVersion: v1
kind: Namespace
metadata:
  name: juicefs-root-cleanup
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: juicefs-root-cleanup-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Pi
  csi:
    driver: csi.juicefs.com
    fsType: juicefs
    nodePublishSecretRef:
      name: juicefs-sc-secret
      namespace: kube-system
    volumeHandle: juicefs-root-cleanup-20260714
  mountOptions:
    - cache-size=0
    - backup-meta=0
    - max-deletes=100
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: root
  namespace: juicefs-root-cleanup
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Pi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: juicefs-root-cleanup-pv
---
apiVersion: v1
kind: Pod
metadata:
  name: cleanup
  namespace: juicefs-root-cleanup
spec:
  containers:
    - name: cleanup
      command:
        - sh
        - -c
        - sleep 86400
      image: juicedata/mount:ce-v1.3.1
      volumeMounts:
        - mountPath: /jfs-root
          name: root
  nodeSelector:
    kubernetes.io/hostname: optiplex5060
  restartPolicy: Never
  volumes:
    - name: root
      persistentVolumeClaim:
        claimName: root
