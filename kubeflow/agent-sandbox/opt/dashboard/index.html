<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Sandbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%234f9cf9'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%2334c38f'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%23e5a54b'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23a78bfa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand">Agent Sandbox</div>
    <nav class="app-toggles" id="app-toggles" aria-label="Apps"></nav>
    <div class="topbar-right">
      <div class="layout-buttons" role="group" aria-label="Layout">
        <button type="button" class="icon-button" data-layout="auto" title="Auto grid">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
        </button>
        <button type="button" class="icon-button" data-layout="columns" title="Side by side">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="13" rx="1"/><rect x="9" y="1.5" width="5.5" height="13" rx="1"/></svg>
        </button>
        <button type="button" class="icon-button" data-layout="rows" title="Stacked">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="5.5" rx="1"/><rect x="1.5" y="9" width="13" height="5.5" rx="1"/></svg>
        </button>
        <button type="button" class="icon-button" data-layout="focus" title="Focused app only">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1"/></svg>
        </button>
      </div>
      <button type="button" class="icon-button" id="about-button" title="About this sandbox" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4.5M8 4.6v.1"/></svg>
      </button>
    </div>
  </header>
  <div class="about" id="about" hidden></div>
  <main class="workspace" id="workspace">
    <div class="empty" id="empty" hidden>Pick an app from the toolbar to open it.</div>
  </main>
  <div class="drag-overlay" id="drag-overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
